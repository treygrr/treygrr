<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 112" width="128" height="112" role="img" aria-label="Rainbow blob cat">
  <defs>
    <linearGradient id="rainbow" x1="0" y1="0" x2="128" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#ff5f6d"/>
      <stop offset="0.17" stop-color="#ffb347"/>
      <stop offset="0.33" stop-color="#fff275"/>
      <stop offset="0.5" stop-color="#7cf29c"/>
      <stop offset="0.67" stop-color="#5fc8ff"/>
      <stop offset="0.83" stop-color="#b38bff"/>
      <stop offset="1" stop-color="#ff5f6d"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="128 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="1.6s" repeatCount="indefinite"/>
    <!-- ears -->
    <path d="M26 46 L30 10 L56 32 Z" fill="url(#rainbow)" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M102 46 L98 10 L72 32 Z" fill="url(#rainbow)" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>
    <!-- blob body -->
    <ellipse cx="64" cy="66" rx="54" ry="40" fill="url(#rainbow)" stroke="#2b2b2b" stroke-width="3"/>
    <!-- eyes -->
    <ellipse cx="46" cy="62" rx="5" ry="7" fill="#2b2b2b"/>
    <ellipse cx="82" cy="62" rx="5" ry="7" fill="#2b2b2b"/>
    <circle cx="47.5" cy="59" r="1.8" fill="#fff"/>
    <circle cx="83.5" cy="59" r="1.8" fill="#fff"/>
    <!-- w mouth -->
    <path d="M56 76 q4 5 8 0 q4 5 8 0" fill="none" stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- blush -->
    <ellipse cx="36" cy="76" rx="6" ry="3.5" fill="#ff7aa8" opacity="0.6"/>
    <ellipse cx="92" cy="76" rx="6" ry="3.5" fill="#ff7aa8" opacity="0.6"/>
  </g>
</svg>
